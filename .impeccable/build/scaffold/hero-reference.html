<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: egypt-a.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#452f21}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1672px">
  <figure class="r-gateway region plate" data-region="gateway"><img src="../../../assets/plates/gateway.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <figure class="r-giza region plate" data-region="giza"><img src="../../../assets/plates/giza.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-papyrus region texture" data-region="papyrus" style="background-image:url('../../../assets/plates/papyrus.png');background-repeat:repeat"></div>
  <figure class="r-nile-image region plate" data-region="nile-image"><img src="../../../assets/plates/nile-image.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-brand region text" data-region="brand"><!-- ЕГИПЕТ small cream spaced serif brand. --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-nav-exposition region text" data-region="nav-exposition"><!-- Экспозиция cream serif navigation link. --><p style="font-size:var(--r-nav-exposition-font);line-height:1.05;margin:0">nav-exposition</p></div>
  <div class="r-nav-sources region text" data-region="nav-sources"><!-- Источники cream serif navigation link. --><p style="font-size:var(--r-nav-sources-font);line-height:1.05;margin:0">nav-sources</p></div>
  <div class="r-motion-control region control" data-region="motion-control"><!-- Small cream thin-line sun icon, pause atmospheric motion control.: rebuild the control's chrome from the crop (comp-spec.mjs --crop motion-control); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-headline region text" data-region="headline"><!-- ЕГИПЕТ large elegant cream high-contrast serif headline. --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-subtitle region text" data-region="subtitle"><!-- Путешествие сквозь тысячелетия cream serif single line. --><p style="font-size:var(--r-subtitle-font);line-height:1.05;margin:0">subtitle</p></div>
  <div class="r-enter region control" data-region="enter"><!-- Войти в историю thin gold outlined rectangular umber button and fine right arrow.: rebuild the control's chrome from the crop (comp-spec.mjs --crop enter); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-index-rule region chrome" data-region="index-rule"><!-- Thin warm gold horizontal chapter-index separator. --></div>
  <div class="r-chapter-count region text" data-region="chapter-count"><!-- 01 / 07 current chapter count. --><p style="font-size:var(--r-chapter-count-font);line-height:1.05;margin:0">chapter-count</p></div>
  <div class="r-index-nile region text" data-region="index-nile"><!-- Нил chapter link. --><p style="font-size:var(--r-index-nile-font);line-height:1.05;margin:0">index-nile</p></div>
  <div class="r-index-pyramids region text" data-region="index-pyramids"><!-- Пирамиды chapter link. --><p style="font-size:var(--r-index-pyramids-font);line-height:1.05;margin:0">index-pyramids</p></div>
  <div class="r-index-pharaohs region text" data-region="index-pharaohs"><!-- Фараоны chapter link. --><p style="font-size:var(--r-index-pharaohs-font);line-height:1.05;margin:0">index-pharaohs</p></div>
  <div class="r-index-writing region text" data-region="index-writing"><!-- Письменность chapter link. --><p style="font-size:var(--r-index-writing-font);line-height:1.05;margin:0">index-writing</p></div>
  <div class="r-index-gods region text" data-region="index-gods"><!-- Боги chapter link. --><p style="font-size:var(--r-index-gods-font);line-height:1.05;margin:0">index-gods</p></div>
  <div class="r-index-life region text" data-region="index-life"><!-- Жизнь chapter link. --><p style="font-size:var(--r-index-life-font);line-height:1.05;margin:0">index-life</p></div>
  <div class="r-index-legacy region text" data-region="index-legacy"><!-- Наследие chapter link. --><p style="font-size:var(--r-index-legacy-font);line-height:1.05;margin:0">index-legacy</p></div>
  <div class="r-reading-number region text" data-region="reading-number"><!-- 01 first chapter sequence number. --><p style="line-height:1.05;margin:0">reading-number</p></div>
  <div class="r-reading-title region text" data-region="reading-title"><!-- Нил. Начало цивилизации. dark umber elegant serif heading. --><p style="font-size:var(--r-reading-title-font);line-height:1.05;margin:0">reading-title</p></div>
</main>
</body>
</html>
